{% load static %}
    <!-- PRESENTATION MODAL: the video plus more about Alex -->
    <dialog class="presentation-modal" id="presentationModal" aria-labelledby="presentationTitle">
      <div class="presentation-toolbar">
        <button type="button" class="modal-close" data-close-presentation aria-label="Close presentation">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>

      <!-- Side by side on wide screens (video stays in view while the text
           scrolls), stacked video-then-text otherwise. -->
      <div class="presentation-body">
        <div class="presentation-media">
          <div class="presentation-header">
            <h2 class="presentation-title" id="presentationTitle">Meet Alex Martínez</h2>
            <p class="presentation-subtitle">AI Engineer</p>
          </div>

          <div class="presentation-video-wrapper">
            <video
              class="presentation-video"
              controls
              playsinline
              preload="none"
              aria-label="Presentation video: Meet Alex Martínez"
              poster="{% static 'public/videos/final-video-en.jpg' %}"
              data-poster-en="{% static 'public/videos/final-video-en.jpg' %}"
              data-poster-de="{% static 'public/videos/final-video-de.jpg' %}"
            >
              <!-- One set per language; scripts.js keeps only the page language's
                   set (without JS the English one plays). The browser takes the
                   first source it can play: 720p H.264 on phones, 1080p H.264
                   (iPhone/Safari, Android, Mac, Windows, most Linux), then
                   VP9/Opus WebM for Linux browsers without H.264. -->
              <source data-lang="en" media="(max-width: 768px)" src="{% static 'public/videos/final-video-en-720p.mp4' %}" type='video/mp4; codecs="avc1.4d401f, mp4a.40.2"' />
              <source data-lang="en" src="{% static 'public/videos/final-video-en.mp4' %}" type='video/mp4; codecs="avc1.640028, mp4a.40.2"' />
              <source data-lang="en" src="{% static 'public/videos/final-video-en.webm' %}" type='video/webm; codecs="vp9, opus"' />
              <source data-lang="de" media="(max-width: 768px)" src="{% static 'public/videos/final-video-de-720p.mp4' %}" type='video/mp4; codecs="avc1.4d401f, mp4a.40.2"' />
              <source data-lang="de" src="{% static 'public/videos/final-video-de.mp4' %}" type='video/mp4; codecs="avc1.640028, mp4a.40.2"' />
              <source data-lang="de" src="{% static 'public/videos/final-video-de.webm' %}" type='video/webm; codecs="vp9, opus"' />
            </video>
          </div>

          <!-- How the video was made -->
          <div class="presentation-ai-note">
            <p class="ai-note-title">
              <svg class="ai-note-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                <path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
              </svg>
              <span>This video was generated with artificial intelligence</span>
            </p>
            <ul class="ai-note-list">
              <li><span class="ai-note-label">Motion graphics</span> Claude API</li>
              <li><span class="ai-note-label">Video avatar</span> InfiniteTalk (MeiGen-AI)</li>
              <li><span class="ai-note-label">Audio</span> native voice; German version with ElevenLabs</li>
            </ul>
          </div>
        </div>

        <div class="presentation-info">
          {% include 'about-me.html' %}
        </div>
      </div>
    </dialog>
